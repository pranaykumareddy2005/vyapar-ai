[project]
name = "vyapar-ai"
version = "0.1.0"
description = "Vyapar AI - Intelligent WhatsApp-Based Commerce System (MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "httpx>=0.28",
    "pyjwt>=2.10",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 reads bcrypt.__about__, removed in bcrypt 4.1. Pin below
    # that until passlib ships a fix (tracked as a Phase 1 known issue).
    "bcrypt<4.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "types-passlib>=1.7",
    # Reads generated invoice PDFs in tests to verify their content (Phase 9).
    "pypdf>=5.0",
]
# Object storage adapters (S3/MinIO). Kept optional so the core installs lean;
# the storage abstraction has an in-process fake used by tests.
storage = [
    "boto3>=1.35",
]
# Invoice PDF generation (Phase 7). Declared now so the dependency decision
# (ReportLab, per approved plan item 12) is recorded, not installed early.
pdf = [
    "reportlab>=4.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Autogenerated by Alembic; keep verbatim (long DDL lines, import order).
"alembic/versions/*" = ["E501", "I001"]
# conftest sets os.environ before importing app modules by design.
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["passlib.*", "boto3.*", "botocore.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
